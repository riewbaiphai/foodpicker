<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>เลือกเมนูวันนี้กินอะไรดี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#2b2420; --sub:#7a6f63;
  --accent:#e2622a; --accent-ink:#ffffff; --line:#ece5db;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1815; --card:#26211d; --ink:#f1ece4; --sub:#a89c8d;
    --accent:#f0783f; --accent-ink:#1c1815; --line:#3a332c;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1815; --card:#26211d; --ink:#f1ece4; --sub:#a89c8d;
  --accent:#f0783f; --accent-ink:#1c1815; --line:#3a332c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans Thai",system-ui,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:20px 14px 60px}
.wrap{width:100%;max-width:560px}
h1{font-size:1.3rem;margin:6px 0 4px;text-align:center}
.sub{color:var(--sub);text-align:center;font-size:.9rem;margin-bottom:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;font-size:.82rem;color:var(--sub)}
.crumbs span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.crumbs span.current{color:var(--accent);border-color:var(--accent)}
.grid{display:grid;gap:10px}
button.opt{
  display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1rem;
  cursor:pointer;transition:.15s;
}
button.opt:active{transform:scale(.98)}
button.opt:hover{border-color:var(--accent)}
.dish{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font-size:1.05rem;text-align:center;font-weight:600;
}
.dishlist{display:grid;gap:8px;margin-top:4px}
.nav{display:flex;gap:8px;margin-top:22px}
.nav button{flex:1;padding:12px;border-radius:10px;border:none;font-size:.95rem;cursor:pointer}
.btn-back{background:var(--card);color:var(--ink);border:1px solid var(--line)!important}
.btn-home{background:var(--accent);color:var(--accent-ink)}
.result{text-align:center;padding:20px 0}
.result .emoji{font-size:2.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2{margin:0 0 10px;font-size:1.15rem;text-align:center;color:var(--accent)}
.card h3{margin:14px 0 6px;font-size:.9rem;color:var(--sub)}
.card ul{margin:0;padding-left:20px;font-size:.92rem;line-height:1.6}
.kcal-big{font-size:1.6rem;font-weight:700;text-align:center;color:var(--accent)}
.macros{display:flex;justify-content:space-around;margin-top:6px;font-size:.85rem;color:var(--sub)}
.exwrap{display:grid;gap:6px;margin-top:4px}
.exrow{display:flex;justify-content:space-between;background:var(--bg);border-radius:8px;padding:8px 12px;font-size:.9rem}
.disclaimer{font-size:.72rem;color:var(--sub);margin-top:14px;line-height:1.5;text-align:center}
.otherbtn{margin-top:14px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:.9rem}

/* ---- หน้าเลือกสัญชาติอาหาร: ดีไซน์เมนูร้านอาหาร ---- */
body.at-menu{
  --bg:#f6ecd9; --card:#fbf5e8; --ink:#3a2a1a; --sub:#8a7355;
  --accent:#8c1f28; --line:#c9b28a;
}
@media (prefers-color-scheme: dark){
  body.at-menu:not([data-theme="light"]){
    --bg:#1c140c; --card:#241a10; --ink:#ecdfc6; --sub:#b39c78;
    --accent:#d79a4b; --line:#4a3c26;
  }
}
body.at-menu[data-theme="dark"]{
  --bg:#1c140c; --card:#241a10; --ink:#ecdfc6; --sub:#b39c78;
  --accent:#d79a4b; --line:#4a3c26;
}
body.at-menu{font-family:'Noto Serif Thai',serif}
body.at-menu h1{display:none}
body.at-menu .sub{display:none}
body.at-menu .crumbs{display:none}
.menu-card{border:1px solid var(--line);padding:30px 22px 22px;position:relative;background:var(--card)}
.menu-card::before,.menu-card::after{content:'';position:absolute;left:14px;right:14px;height:1px;background:var(--line)}
.menu-card::before{top:9px}
.menu-card::after{bottom:9px}
.menu-title{font-size:1.55rem;font-weight:700;text-align:center;margin:0 0 6px;letter-spacing:.03em}
.menu-subtitle{text-align:center;font-size:.85rem;color:var(--sub);font-style:italic;margin-bottom:20px}
.menu-list{display:flex;flex-direction:column}
.menu-row{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;
  border-top:1px solid var(--line);padding:16px 2px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.menu-list .menu-row:first-child{border-top:none}
.menu-row:hover .name{color:var(--accent)}
.menu-row-text{display:flex;flex-direction:column;line-height:1.3}
.menu-row .name{font-size:1.08rem;font-weight:700}
.menu-row .eng{font-size:.7rem;color:var(--sub);font-style:italic}
.menu-row .leader{flex:1;min-width:16px;border-bottom:1px dotted var(--line);margin:0 4px 5px}
.menu-row .count{font-size:.78rem;color:var(--accent);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍜 วันนี้กินอะไรดี?</h1>
  <div class="sub" id="subtitle">เลือกไปเรื่อยๆ จนกว่าจะเจอเมนูที่ใช่</div>

  <div id="content"></div>

</div>

let path = [];
let selectedDish = null;

function currentNode(){
  let node = DATA;
  for(const key of path) node = node[key];
  return node;
}

// ---- estimation helpers (rough, deterministic guesses for decision-making — not lab-verified nutrition data) ----
const PROTEIN_KW = [["หมูกรอบ","หมูกรอบ"],["หมูสับ","หมูสับ"],["หมูสามชั้น","หมูสามชั้น"],["หมู","เนื้อหมู"],["ไก่","เนื้อไก่"],["เนื้อวากิว","เนื้อวากิว"],["เนื้อ","เนื้อวัว"],["กุ้ง","กุ้ง"],["ปลาหมึก","ปลาหมึก"],["ปลา","เนื้อปลา"],["ปู","เนื้อปู"],["เป็ด","เนื้อเป็ด"],["ไข่เยี่ยวม้า","ไข่เยี่ยวม้า"],["ไข่","ไข่"],["ทูน่า","ปลาทูน่า"],["แซลมอน","แซลมอนดิบ/ย่าง"],["แพะ","เนื้อแพะ"],["เต้าหู้","เต้าหู้"]];
const CARB_KW = [["ข้าวเหนียว","ข้าวเหนียว"],["ข้าว","ข้าวสวย"],["เส้นหมี่","เส้นหมี่"],["หมี่","เส้นหมี่"],["บะหมี่","เส้นบะหมี่"],["ก๋วยเตี๋ยว","เส้นก๋วยเตี๋ยว"],["อุด้ง","เส้นอุด้ง"],["โซบะ","เส้นโซบะ"],["สปาเกตตี","เส้นสปาเกตตี"],["พาสต้า","เส้นพาสต้า"],["นาน","แป้งนาน"],["โรตี","แป้งโรตี"],["ขนมปัง","ขนมปัง"],["พิซซ่า","แป้งพิซซ่า"],["ตอร์ติญ่า","แป้งตอร์ติญ่า"],["ทาโก้","แป้งทาโก้"]];
const FLAVOR_KW = [["กะเพรา","ใบกะเพรา"],["กะทิ","กะทิ"],["ชีส","ชีส"],["ครีม","ครีม"],["มะนาว","มะนาว"],["ถั่ว","ถั่ว"],["ผัก","ผักสด"],["กระเทียม","กระเทียม"],["พริก","พริก"],["น้ำปลา","น้ำปลา"],["มะเขือเทศ","มะเขือเทศ"],["หอม","หอมใหญ่/หอมแดง"],["มะม่วง","มะม่วงสุก"],["ทุเรียน","ทุเรียน"]];
const METHOD_KW = [["ทอด","ทอด"],["ผัด","ผัด"],["ย่าง","ย่าง"],["อบ","อบ"],["นึ่ง","นึ่ง"],["ต้ม","ต้ม/ตุ๋น"],["แกง","แกงในน้ำพริกแกง"],["ยำ","ยำ"],["ตำ","ตำ"],["ดอง","ดอง/หมัก"]];

function guessIngredients(name){
  const items = [];
  for(const [kw,label] of PROTEIN_KW) if(name.includes(kw)){ items.push(label); break; }
  for(const [kw,label] of CARB_KW) if(name.includes(kw)){ items.push(label); break; }
  for(const [kw,label] of FLAVOR_KW) if(name.includes(kw)) items.push(label);
  let method = null;
  for(const [kw,label] of METHOD_KW) if(name.includes(kw)){ method = label; break; }
  if(method) items.push('ปรุงแบบ' + method);
  if(items.length===0) items.push('วัตถุดิบหลักตามชื่อเมนู (ดูรายละเอียดจากร้าน)');
  return [...new Set(items)];
}

function estimateKcal(name){
  let base = 420;
  if(/ของหวาน|เค้ก|ทาร์ต|ไอศกรีม|พุดดิ้ง|วาฟเฟิล|โทสต์|ครัวซองต์|บราวนี่/.test(name)) base = 360;
  else if(/เครื่องดื่ม|ชา|กาแฟ|โซดา|สมูทตี้|น้ำส้ม|น้ำมะพร้าว|ปั่น/.test(name)) base = 190;
  else if(/สลัด/.test(name)) base = 280;
  else if(/ก๋วยเตี๋ยว|ราเมน|บะหมี่|เส้น|หมี่|อุด้ง|โซบะ|พาสต้า|สปาเกตตี|จาจังมยอน/.test(name)) base = 480;
  else if(/ข้าว/.test(name)) base = 560;
  for(const [kw] of [["ทอด",130]]) if(name.includes('ทอด')) base += 130;
  if(name.includes('ผัด')) base += 60;
  if(/ย่าง|อบ/.test(name)) base += 40;
  if(/ต้ม|แกง|ซุป|น้ำใส/.test(name)) base -= 20;
  if(/ชีส|เนย|ครีม|กะทิ/.test(name)) base += 80;
  if(/หมูกรอบ|สามชั้น|หม้อไฟ/.test(name)) base += 90;
  let hash = 0; for(const c of name) hash = (hash*31 + c.charCodeAt(0)) % 97;
  base += (hash % 40) - 20;
  return Math.max(130, Math.round(base/10)*10);
}

function macroSplit(kcal, name){
  let carbPct=0.5, proteinPct=0.2, fatPct=0.3;
  if(/ของหวาน|เค้ก|ไอศกรีม|โซดา|ชา|กาแฟ|สมูทตี้|น้ำ/.test(name)) { carbPct=0.65; proteinPct=0.08; fatPct=0.27; }
  else if(/สลัด|ต้ม|แกง|ซุป/.test(name)) { carbPct=0.35; proteinPct=0.35; fatPct=0.30; }
  else if(/ทอด|กรอบ/.test(name)) { carbPct=0.35; proteinPct=0.25; fatPct=0.40; }
  return {
    carb: Math.round(kcal*carbPct/4),
    protein: Math.round(kcal*proteinPct/4),
    fat: Math.round(kcal*fatPct/9)
  };
}

function exerciseMinutes(kcal){
  const weightKg = 60; // สมมติฐานน้ำหนักตัวเฉลี่ย
  const activities = [ ['เดินเร็ว', 4.3, '🚶'], ['วิ่งจ็อกกิ้ง', 7.0, '🏃'], ['ปั่นจักรยาน', 6.8, '🚴'] ];
  return activities.map(([label, met, icon]) => {
    const kcalPerMin = met * 3.5 * weightKg / 200;
    return { label, icon, minutes: Math.max(1, Math.round(kcal / kcalPerMin)) };
  });
}

function renderDishCard(name){
  const contentEl = document.getElementById('content');
  const subEl = document.getElementById('subtitle');
  subEl.textContent = 'ข้อมูลโดยประมาณของเมนูนี้';
  const kcal = estimateKcal(name);
  const macro = macroSplit(kcal, name);
  const ingredients = guessIngredients(name);
  const ex = exerciseMinutes(kcal);
  contentEl.innerHTML = `
    <div class="card">
      <h2>${name}</h2>
      <h3>ส่วนประกอบหลัก (โดยประมาณ)</h3>
      <ul>${ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>
      <h3>พลังงานโดยประมาณ</h3>
      <div class="kcal-big">${kcal} kcal</div>
      <div class="macros"><span>คาร์บ ${macro.carb}g</span><span>โปรตีน ${macro.protein}g</span><span>ไขมัน ${macro.fat}g</span></div>
      <h3>ต้องออกกำลังกายเท่าไหร่ถึงจะเผาผลาญหมด (น้ำหนักตัวสมมติ 60 กก.)</h3>
      <div class="exwrap">${ex.map(e=>`<div class="exrow"><span>${e.icon} ${e.label}</span><span>${e.minutes} นาที</span></div>`).join('')}</div>
      <div class="disclaimer">*ตัวเลขทั้งหมดเป็นการประมาณการคร่าวๆ เพื่อช่วยตัดสินใจเท่านั้น ไม่ใช่ข้อมูลโภชนาการที่วัดจริง ปริมาณจริงขึ้นกับสูตรและขนาดจานของแต่ละร้าน</div>
    </div>
    <button class="otherbtn" id="otherDishBtn">← เลือกเมนูอื่นในหมวดนี้</button>
  `;
  document.getElementById('otherDishBtn').addEventListener('click', ()=>{ selectedDish = null; render(); });
}

function countDishes(node){
  if(Array.isArray(node)) return node.length;
  return Object.values(node).reduce((s,v)=>s+countDishes(v),0);
}

function splitName(k){
  const m = k.match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  return m ? [m[1], m[2]] : [k, ''];
}

function renderCuisineMenu(node){
  document.getElementById('content').innerHTML = `
    <div class="menu-card">
      <div class="menu-title">สัญชาติอาหารวันนี้</div>
      <div class="menu-subtitle">— กดเลือกหมวดที่อยากลิ้มลอง —</div>
      <div class="menu-list">
        ${Object.keys(node).map(k=>{
          const [th,eng] = splitName(k);
          const count = countDishes(node[k]);
          return `<button class="menu-row" data-key="${encodeURIComponent(k)}">
            <div class="menu-row-text"><span class="name">${th}</span>${eng?`<span class="eng">${eng}</span>`:''}</div>
            <div class="leader"></div>
            <div class="count">${count} เมนู</div>
          </button>`;
        }).join('')}
      </div>
    </div>`;
  document.querySelectorAll('.menu-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      path.push(decodeURIComponent(btn.dataset.key));
      render();
    });
  });
}

function render(){
  const node = currentNode();
  const isLeaf = Array.isArray(node);
  document.body.classList.toggle('at-menu', path.length===0);
  if(path.length===0){
    renderCuisineMenu(node);
    document.getElementById('nav').style.display = 'none';
    return;
  }
  const crumbsEl = document.getElementById('crumbs');
  const contentEl = document.getElementById('content');
  const navEl = document.getElementById('nav');
  const subEl = document.getElementById('subtitle');

  crumbsEl.innerHTML = '<span' + (path.length===0?' class="current"':'') + '>เริ่มต้น</span>' +
    path.map((p,i)=>`<span${i===path.length-1 && !(isLeaf && selectedDish)?' class="current"':''}>${p.split(' (')[0]}</span>`) +
    (isLeaf && selectedDish ? `<span class="current">${selectedDish}</span>` : '');

  if(isLeaf){
    if(selectedDish){
      renderDishCard(selectedDish);
    } else {
      subEl.textContent = 'เจอหมวดสุดท้ายแล้ว กดเมนูที่สนใจเพื่อดูข้อมูล';
      contentEl.innerHTML = '<div class="dishlist">' +
        node.map(d=>`<button class="opt dish" data-dish="${encodeURIComponent(d)}">${d}</button>`).join('') + '</div>';
      contentEl.querySelectorAll('[data-dish]').forEach(btn=>{
        btn.addEventListener('click', ()=>{ selectedDish = decodeURIComponent(btn.dataset.dish); render(); });
      });
    }
  } else {
    subEl.textContent = path.length===0
      ? 'เลือกประเภทอาหารที่อยากกิน'
      : 'เลือกต่อไปเรื่อยๆ จนถึงเมนู';
    contentEl.innerHTML = '<div class="grid">' +
      Object.keys(node).map(k=>`<button class="opt" data-key="${encodeURIComponent(k)}">${k}</button>`).join('') +
      '</div>';
    contentEl.querySelectorAll('.opt').forEach(btn=>{
      btn.addEventListener('click',()=>{
        path.push(decodeURIComponent(btn.dataset.key));
        render();
      });
    });
  }
  navEl.style.display = (path.length===0 && !selectedDish) ? 'none' : 'flex';
}

document.getElementById('backBtn').addEventListener('click',()=>{
  if(selectedDish){ selectedDish = null; } else { path.pop(); }
  render();
});
document.getElementById('homeBtn').addEventListener('click',()=>{ path = []; selectedDish = null; render(); });

render();
</script>
